<!doctype html>
<html lang="en" data-theme="golden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCT Admin</title>
    <!-- Logotype only: Manrope ExtraBold. Falls back to the system sans if unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.js).
      try {
        var theme = JSON.parse(localStorage.getItem("cms.ui.theme"));
        if (theme === "styled" || theme === "golden" || theme === "wireframe") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
